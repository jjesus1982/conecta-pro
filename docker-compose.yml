services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: conecta-pro-postgres
    restart: unless-stopped
    command: postgres -c max_connections=150
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_pro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # SEGURANÇA: Porta NÃO exposta publicamente - acesso apenas via rede interna Docker
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conecta_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: conecta-pro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    # SEGURANÇA: Porta NÃO exposta publicamente - acesso apenas via rede interna Docker
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Backend FastAPI
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecta-pro-backend
    restart: unless-stopped
    stop_grace_period: 30s
    # env_file injeta o .env inteiro (inclui AGENT_ENABLED/CHATWOOT_*/WHATSAPP_WEBHOOK_SECRET
    # que faltavam). Lido ANTES de environment: -> environment: VENCE em colisao (blindagem
    # das criticas: DATABASE_URL/OPENAI_API_KEY/REDIS_URL/SMTP_*/PORT permanecem do environment:).
    env_file:
      - .env
    environment:
      # App
      APP_NAME: ${APP_NAME:-Conecta PRO}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8080
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-conecta_pro}
      # APIs Externas
      WHATSAPP_API_ENABLED: ${WHATSAPP_API_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WHATSAPP_INSTANCE_ID: ${WHATSAPP_INSTANCE_ID:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_ENABLED: ${GOOGLE_MAPS_ENABLED:-false}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://erp.conectamais.pro/api/v1/auth/google/callback}
      # Google Drive OAuth2
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_REDIRECT_URI: ${GDRIVE_REDIRECT_URI:-}
      GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID:-}
      GDRIVE_KITS_FOLDER_ID: ${GDRIVE_KITS_FOLDER_ID:-}
      GDRIVE_OWNER_EMAIL: ${GDRIVE_OWNER_EMAIL:-}
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      FRONTEND_URL: ${FRONTEND_URL:-https://erp.conectamais.pro}
      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@conectamais.pro}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Conecta PRO}
      MAPS_DEFAULT_CENTER_LAT: ${MAPS_DEFAULT_CENTER_LAT:-}
      MAPS_DEFAULT_CENTER_LNG: ${MAPS_DEFAULT_CENTER_LNG:-}
      # Telegram (OpenClaw alertas)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Bartolo AI - LLM Configuration
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@redis:6379/1
      REDIS_TTL: ${REDIS_TTL:-3600}
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@redis:6379/0
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no .env}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Sólides Integration
      SOLIDES_API_TOKEN: ${SOLIDES_API_TOKEN:-}
      SOLIDES_WEBHOOK_SECRET: ${SOLIDES_WEBHOOK_SECRET:-}
      # Domínio Sistemas (Contabilidade TOTVS)
      DOMINIO_API_KEY: ${DOMINIO_API_KEY:-}
      DOMINIO_API_URL: ${DOMINIO_API_URL:-https://api.dominiosistemas.com.br}
      DOMINIO_CNPJ: ${DOMINIO_CNPJ:-35710481000103}
      DOMINIO_ENABLED: ${DOMINIO_ENABLED:-true}
      # Certificado Digital
      CERTIFICATE_PATH: ${CERTIFICATE_PATH:-/opt/conecta-pro/credentials/certificates/certificado.pfx}
      CERTIFICATE_PASSWORD: ${CERTIFICATE_PASSWORD:-}
      # NFS-e Manaus (Sistema Legado - apenas consultas/cancelamentos)
      NFSE_MANAUS_CNPJ: ${NFSE_MANAUS_CNPJ:-}
      NFSE_MANAUS_USUARIO: ${NFSE_MANAUS_USUARIO:-}
      NFSE_MANAUS_SENHA: ${NFSE_MANAUS_SENHA:-}
      NFSE_MANAUS_IM: ${NFSE_MANAUS_IM:-}
      NFSE_MANAUS_ENVIRONMENT: ${NFSE_MANAUS_ENVIRONMENT:-producao}
      # NFS-e Padrão Nacional (Obrigatório a partir de 01/01/2026)
      NFSE_NACIONAL_CNPJ: ${NFSE_NACIONAL_CNPJ:-}
      NFSE_NACIONAL_IM: ${NFSE_NACIONAL_IM:-}
      NFSE_NACIONAL_COD_MUNICIPIO: ${NFSE_NACIONAL_COD_MUNICIPIO:-1302603}
      NFSE_NACIONAL_RAZAO_SOCIAL: ${NFSE_NACIONAL_RAZAO_SOCIAL:-}
      NFSE_NACIONAL_ENVIRONMENT: ${NFSE_NACIONAL_ENVIRONMENT:-homologacao}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health/detailed", "-o", "/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s  # 5 minutos para startup com VPS lento
    networks:
      - conecta-pro-network
      # rede do Chatwoot/baileys (external): permite backend -> chatwoot-fazerai:3000
      # (nota privada do copiloto + download de anexos). Antes era docker network
      # connect manual -> morria em recreate. Agora DURAVEL via compose.
      - chatwoot-fazerai-net
    volumes:
      - ./logs:/app/logs
      # Uploads GED
      - ./uploads:/app/uploads
      # Credenciais (certificados digitais)
      - ./credentials:/opt/conecta-pro/credentials:ro
      - ./credentials:/app/credentials:ro
      - ./data:/app/data
      - ./reports:/opt/conecta-pro/reports
      - ./frontend:/opt/conecta-pro/frontend:ro
      # Docker socket para OpenClaw (remediação automática)
      - /var/run/docker.sock:/var/run/docker.sock
      # Módulos Fase 3 (externos ao backend)
      - ./01_security_lgpd:/opt/conecta-pro/security_lgpd:ro
      - ./02_health_occupational:/opt/conecta-pro/health_occupational:ro
      - ./03_government_integrations:/opt/conecta-pro/government_integrations:ro

  # ==========================================================================
  # Frontend Next.js
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://erp.conectamais.pro
    container_name: conecta-pro-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://erp.conectamais.pro
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - conecta-pro-network
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================================================
  # Nginx Reverse Proxy + SSL
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: conecta-pro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Chatwoot PostgreSQL (pgvector/pgvector:pg16 — necessário para Chatwoot v3+)
  # Autorização Jordan Jesus 2026-05-05 — §82
  # ==========================================================================
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot_production
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Chatwoot — Central Multiagente WhatsApp
  # Autorização Jordan Jesus 2026-05-05 — §82
  # ==========================================================================
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot
    restart: unless-stopped
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    ports:
      - "3002:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@chatwoot-postgres:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/2
      - FRONTEND_URL=https://chat.conectamais.pro
      - DEFAULT_LOCALE=pt_BR
      - INSTALLATION_ENV=docker
      - MAILER_SENDER_EMAIL=noreply@conectamais.pro
      - SMTP_ADDRESS=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ENABLE_STARTTLS_AUTO=false
      - SMTP_TLS=true
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conecta-pro-network
    volumes:
      - chatwoot_data:/app/storage

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@chatwoot-postgres:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/2
      - FRONTEND_URL=https://chat.conectamais.pro
      - DEFAULT_LOCALE=pt_BR
      - INSTALLATION_ENV=docker
      - MAILER_SENDER_EMAIL=noreply@conectamais.pro
      - SMTP_ADDRESS=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ENABLE_STARTTLS_AUTO=false
      - SMTP_TLS=true
      - FORCE_SSL=false
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conecta-pro-network
    volumes:
      - chatwoot_data:/app/storage

  # ==========================================================================
  # Evolution API — WhatsApp Business (auto-hospedada)
  # Autorização Jordan Jesus 2026-05-05 — §80
  # ==========================================================================
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URL}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
      # Chatwoot integration — habilitado em T5-CHATWOOT (2026-05-05)
      - CHATWOOT_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conecta-pro-network
    volumes:
      - evolution_data:/evolution/instances

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  evolution_data:
    driver: local
  chatwoot_data:
    driver: local
  chatwoot_postgres_data:
    driver: local

networks:
  conecta-pro-network:
    driver: bridge
  # rede pre-existente do stack Chatwoot fazer.ai (criada fora deste compose)
  chatwoot-fazerai-net:
    external: true
