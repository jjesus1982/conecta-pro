# ============================================================================
# Conecta PRO - ERP Frontend (Next.js) & Backend Reverse Proxy
# Domain: erp.conectamais.pro
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=50r/s;

# Upstream backend (FastAPI)
upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Upstream frontend (Next.js)
upstream frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    if ($host = erp.conectamais.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name erp.conectamais.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.conectamais.pro;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/erp.conectamais.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.conectamais.pro/privkey.pem; # managed by Certbot
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers (delegados ao Next.js middleware para evitar duplicação)
    # Next.js adiciona: X-Frame-Options DENY, X-Content-Type-Options, Referrer-Policy,
    # Permissions-Policy, HSTS (63072000s + preload), CSP completo.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # Bloquear IPs da geo blocklist
    if ($blocked_ip) { return 403; }

    # Login: rate limiting específico (5 req/min, burst 3)
    location /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Upload: rate limiting específico (10 req/min)
    location ~* ^/api/v1/.*/upload {
        limit_req zone=upload_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 50M;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # API endpoints -> Backend (FastAPI)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Retry: tenta 2x antes de retornar erro (cobre restarts rapidos)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Timeouts — falha rapido para retornar 503 amigavel
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS gerenciado pelo FastAPI (CORSMiddleware) — nao duplicar aqui
        # Apenas tratar preflight OPTIONS no nginx para performance
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://erp.conectamais.pro" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Health check endpoint -> Backend
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Multi-Agent Dashboard (static files)
    location = /agents/dashboard {
        alias /opt/conecta-pro/agents/dashboard.html;
        types { } default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        etag off;
    }
    location /agents/dashboard/ {
        alias /opt/conecta-pro/agents/;
        index dashboard.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets estáticos Next.js: servidos DIRETO do filesystem do host
    # Chunks de builds anteriores ficam acessíveis; zero dependência do container
    location ^~ /_next/static/ {
        alias /opt/conecta-pro/frontend/.next/static/;
        # Se o arquivo nao existir no host (drift de build host<->container),
        # cai pro container em vez de retornar 404 -> evita ChunkLoadError.
        try_files $uri @frontend_static_fallback;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Service Worker: nunca cachear
    location = /sw.js {
        root /var/www/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/javascript" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
    }

    # Robô DET — noVNC (login supervisionado gov.br). WebSocket + assets.
    location /det-vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend -> Next.js (porta 3001)
    location / {
        limit_req zone=frontend_limit burst=100 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Sobrescrever Cache-Control do Next.js para páginas HTML
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;

        # Cache longo para outros assets estáticos (imagens, fontes, etc.)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }
    }

    # Fallback: /_next/static/ não encontrado no host → container
    location @frontend_static_fallback {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
