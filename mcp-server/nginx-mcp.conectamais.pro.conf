# vhost nginx para o conector MCP do Conecta PRO.
# Instalar em /etc/nginx/sites-available/mcp.conectamais.pro e habilitar (ver README_MCP.md).
# O certbot --nginx adiciona o bloco 443/SSL automaticamente após o DNS apontar.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.conectamais.pro;

    # Proxy para o servidor MCP (container local, só 127.0.0.1:8788). Auth Bearer é validada lá dentro.
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;   # repassa o Bearer do Claude
        proxy_set_header Connection "";

        # MCP usa Streamable HTTP (SSE) — desliga buffering e estende timeouts
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
