# ============================================================================
# Conecta PRO — Hermes Agent config (Fase 5.2a)
# HERMES_HOME=/data ; este arquivo = /data/config.yaml
# Segredos NUNCA ficam aqui: chegam por ENV (${VAR}) no container.
# ============================================================================

# ---------------------------------------------------------------------------
# Modelo / provedor de inferencia — OpenAI direto.
#   O default e gpt-5; o cliente pode sobrescrever por request (ex.: gpt-5-mini)
#   via o campo `model` da API OpenAI-compat.
# ---------------------------------------------------------------------------
model:
  default: "deepseek-v4-flash"
  provider: "deepseek"                # provider NATIVO do Hermes (docs 2026);
                                   # (o alias "openai" roteia p/ openrouter — nao usar)
  base_url: "https://api.deepseek.com/v1"
  # OPENAI_API_KEY chega por ENV (.env do container / -e).

# ---------------------------------------------------------------------------
# Conectores MCP — o conector-IRMAO em modo bearer (conecta-pro-mcp-internal).
#   O conector de PRODUCAO (conecta-pro-mcp) usa Google OAuth de entrada, que
#   o Hermes nao fala. Por isso subimos um irmao com a MESMA imagem
#   (conecta-pro-mcp:latest) em AUTH_MODE=bearer (MCP_AUTH_TOKEN), interno.
#   URL interna na rede docker; auth por Bearer (MCP_BEARER == MCP_AUTH_TOKEN).
#   include: [] => TODAS as tools expostas pelo conector ficam visiveis.
# ---------------------------------------------------------------------------
mcp_servers:
  conecta:
    url: "http://conecta-pro-mcp-internal:8788/mcp"
    headers:
      Authorization: "Bearer ${MCP_BEARER}"
    tools:
      # ⭐ 18/09/2026 — SO AS QUE EXECUTAM. Medido no gate deste conector:
      #   146 servidas no escopo · 4 executam · 142 recusam SEMPRE (fail-closed).
      # Ele roda MCP_MODO=agente e exige `x-usuario-token` por chamada em tudo que toca
      # pessoa ou dinheiro; o Hermes nao sabe mandar cabecalho por chamada (headers estaticos
      # por conexao, `tools/mcp_tool.py`). As 142 iam no catalogo de TODO turno so para
      # recusar: 150 ferramentas, 78.602 caracteres, 50% do payload medido no dump real de
      # /data/sessions. Pior que custo, o modelo gastava raciocinio escolhendo ferramenta que
      # nunca ia rodar.
      #
      # ⚠️ QUANDO ALGUEM CONSTRUIR o repasse de identidade por chamada, ESTA LISTA TEM DE
      # CRESCER — senao ela vira a nova parede. O cacador `checar_hermes_so_ve_o_que_executa`
      # compara esta lista com o que o gate deixa passar e acusa nos DOIS sentidos.
      include:
        - consultar_parametros_precificacao
        - listar_precos_funcao
        - simular_preco
        - status_whatsapp
    supports_parallel_tool_calls: false
    timeout: 120
    connect_timeout: 60
    enabled: true

  # 10/09/2026 — conector do KIT DOCUMENTAL (escopo ged,fiscal · 42 ferramentas).
  #   O irmao `conecta` roda MCP_MODO=agente e exige `x-usuario-token` por chamada em tudo
  #   que toca pessoa ou dinheiro. O Hermes NAO sabe mandar cabecalho por chamada (headers
  #   estaticos por conexao), entao ali ele fica com 6 ferramentas uteis de 146.
  #   No fechamento do kit nao ha terceiro sobre quem responder — e a propria empresa
  #   fechando o proprio mes. Este conector nao exige repasse de identidade; quem o protege
  #   e o ESCOPO: so ged e fiscal, nada de folha, cadastro de pessoa, PIX ou CRM.
  ged:
    url: "http://conecta-pro-mcp-ged:8788/mcp"
    headers:
      Authorization: "Bearer ${MCP_BEARER}"
    # SEM bloco `tools:` de propósito — "nenhum filtro" = todas as ferramentas, e isso vale
    # igual na 0.19, 0.20 e 0.21. NÃO escrever `include: []`: a semântica INVERTEU entre as
    # versões e o comentário do upstream é explícito na 0.21 —
    #   "include: [] → register nothing (an explicit empty whitelist)".
    # Na 0.19 `if include_set:` tratava lista vazia como falsy e liberava tudo. Medido em
    # 18/09/2026 ao testar a 0.21.3: `ged` e `pessoas` apareceram com 4 ferramentas cada — os
    # 4 VERBOS GENÉRICOS (get_prompt/list_prompts/list_resources/read_resource) — e o
    # `ponto_dashboard` sumiu. Eu quase atribuí isso a incompatibilidade de protocolo MCP 2.0 e
    # abri um projeto de upgrade do fastmcp; o protocolo estava certo, era esta linha.
    supports_parallel_tool_calls: false
    timeout: 180
    connect_timeout: 60
    enabled: true

  # ⭐ 11/09/2026 — conector de PESSOAS (escopo `pessoas` · 41 ferramentas).
  #   Decisao do Jordan: "quero o Hermes realmente inteligente ... tudo funcione para coleta
  #   e resolucao de problemas". Aqui ele enxerga o TRABALHO da pessoa: ponto, escala, posto,
  #   ocorrencia, comunicado. Fora do escopo: fechar folha, holerite, rescisao, ferias, CRM.
  #
  #   Este conector sobe com MCP_IDENTIDADE=propria + MCP_MODO=agente. Em portugues claro:
  #   a pergunta tem dono declarado (`hermes`, e e esse nome que aparece na Central de
  #   Aprovacoes), e as tres acoes de risco do escopo — revisar_justificativa_ponto,
  #   propor_comunicado, enviar_whatsapp — NAO executam: viram pedido para um humano aprovar.
  pessoas:
    url: "http://conecta-pro-mcp-pessoas:8788/mcp"
    headers:
      Authorization: "Bearer ${MCP_BEARER}"
    # SEM bloco `tools:` de propósito — "nenhum filtro" = todas as ferramentas, e isso vale
    # igual na 0.19, 0.20 e 0.21. NÃO escrever `include: []`: a semântica INVERTEU entre as
    # versões e o comentário do upstream é explícito na 0.21 —
    #   "include: [] → register nothing (an explicit empty whitelist)".
    # Na 0.19 `if include_set:` tratava lista vazia como falsy e liberava tudo. Medido em
    # 18/09/2026 ao testar a 0.21.3: `ged` e `pessoas` apareceram com 4 ferramentas cada — os
    # 4 VERBOS GENÉRICOS (get_prompt/list_prompts/list_resources/read_resource) — e o
    # `ponto_dashboard` sumiu. Eu quase atribuí isso a incompatibilidade de protocolo MCP 2.0 e
    # abri um projeto de upgrade do fastmcp; o protocolo estava certo, era esta linha.
    supports_parallel_tool_calls: false
    timeout: 120
    connect_timeout: 60
    enabled: true

# ---------------------------------------------------------------------------
# Aprovacoes — defesa em profundidade.
#   mode: smart      -> avalia risco por chamada.
#   cron_mode: deny  -> jobs agendados NUNCA executam acao sensivel sozinhos.
#   deny: glob dos verbos de "dinheiro que sai" e execucao/aprovacao.
#         O Hermes so PROPOE; execucao real de PIX/pagamento = gate humano+OTP
#         no ERP, fora deste agente.
# ---------------------------------------------------------------------------
approvals:
  mode: smart
  cron_mode: deny
  deny:
    - "*pix*"
    - "*pagar*"
    - "*pagamento*"
    - "*transfer*"
    - "*executar*"
    - "*aprovar*"

# ---------------------------------------------------------------------------
# Constituicao do agente: /data/SOUL.md (auto-carregada do HERMES_HOME=/data
# como identidade / slot #1 do system prompt). Nao precisa de chave aqui.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# MEMORIA PERSISTENTE — 23/08/2026.
#   Estava AUSENTE do config: o Hermes reabria cada conversa do zero, sem saber
#   nada do que ja tinha sido decidido nesta casa. Era o que fazia dele um
#   andaime generico em vez de um agente NOSSO.
#   Arquivos vivem em HERMES_HOME (/data): MEMORY.md (fatos) e USER.md (perfil).
#   write_approval: true — memoria e' o que ele leva para a proxima conversa;
#   deixar o agente gravar sozinho e' deixa-lo reescrever a propria premissa.
# ---------------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: true

# ---------------------------------------------------------------------------
# SKILLS — memoria PROCEDURAL: o agente registra COMO fazer algo que ja fez.
#   guard_agent_created: varre skill criada por agente atras de padrao perigoso.
#   write_approval: skill nova passa por humano. Numa casa onde o agente mexe em
#   folha e contrato, procedimento que ele escreve sozinho vira regra sozinho.
# ---------------------------------------------------------------------------
skills:
  guard_agent_created: true
  write_approval: true

# ---------------------------------------------------------------------------
# PLUGINS — allow-list. Sao opt-in: so carrega o que estiver nomeado aqui.
#
# skill-retrieval (18/09/2026): as 75 skills iam no system prompt de TODO turno
#   com titulo + descricao — 24.622 chars, ~6.155 tokens. Ele troca isso por uma
#   lista de NOMES e injeta, por turno, so as top-K relevantes (BM25 local, sem
#   rede). Auditado antes de instalar: nenhum import de rede, subprocess, exec ou
#   escrita em disco; um unico hook (`pre_llm_call`) que falha devolvendo None.
#   Origem e sha do que foi baixado em `plugins/skill-retrieval/ORIGEM.sha256`.
#
#   ⚠️ Leva uma ADAPTACAO DA CASA no `__init__.py` porque rodamos Hermes v0.19.0 e
#   o plugin pede >= 0.20.0 — sem ela a compactacao nao alcanca o chamador e o
#   plugin so ADICIONA tokens. Ler o bloco de comentario la. Sai quando subirmos.
# ---------------------------------------------------------------------------
plugins:
  enabled:
    - skill-retrieval

# ---------------------------------------------------------------------------
# DELEGACAO — subagentes herdam provedor e credencial do pai ("auto").
#   Sem isto, tarefa longa ocupa a conversa inteira em vez de ser paralelizada.
# ---------------------------------------------------------------------------
delegation:
  provider: "auto"
  model: ""
