# Pre-commit hooks para Conecta PRO
repos:
  # Hooks padrao
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict

  # Ruff (linting + formatting Python)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Bandit (security)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, -ll, -q, --skip, B608]
        files: ^backend/
        exclude: tests/

  # Gitleaks (secret detection)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Detect-secrets (secondary secret scanner)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # `mcp-server/changelog.json` é 100% metadado do NOSSO git log, gerado por
        # `mcp-server/gerar_changelog.py`. Os "segredos" que o detector acha são hashes
        # de commit abreviados — hex de alta entropia por construção, diferentes a cada
        # regeneração. Sem isto, toda regeneração exigiria remendar o baseline (17/09/2026).
        exclude: (backend/venv|frontend/node_modules|\.test\.|\.spec\.|tsconfig\.tsbuildinfo|mcp-server/changelog\.json)

  # Governança de sessões autônomas (anti-revert, anti-multi-módulo)
  - repo: local
    hooks:
      - id: governance-check
        name: Governance — Multi-module commit guard
        language: script
        entry: scripts/governance-check.sh
        pass_filenames: false
        always_run: true
