# Docker Compose - Monitoring Stack ERP Conecta Mais
# ===================================================
# Prometheus + Grafana + Alertmanager

version: '3.8'

services:
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: erp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:10.2.2
    container_name: erp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-erp_admin_2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - monitoring

  # Node Exporter (metricas do host)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: erp-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /opt/conecta-pro/monitoring/textfile_collector:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'
    networks:
      - monitoring

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: erp-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://conecta-pro-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-conecta_redis_2024}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # Postgres Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: erp-postgres-exporter
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - conecta-pro_conecta-pro-network

  # ==========================================================================
  # Loki (Agregador de Logs)
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: erp-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

  # ==========================================================================
  # AlertManager (Gerenciamento de Alertas)
  # ==========================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: erp-alertmanager
    restart: unless-stopped
    ports:
      # 🔒 127.0.0.1: sem o prefixo o Docker publica em 0.0.0.0 e escreve a própria
      # regra no iptables, furando o firewall do host. Medido em 11/09/2026 pelo IP
      # público: respondia 200 SEM AUTENTICAÇÃO NENHUMA.
      # Quem consome de verdade fala pela rede Docker, onde nada muda.
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      # Telegram para notificações de alertas
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEB_EXTERNAL_URL=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring

  # ==========================================================================
  # Promtail (Coletor de Logs)
  # ==========================================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: erp-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /opt/conecta-pro/logs:/var/log/conecta-pro:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  conecta-pro_conecta-pro-network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  alertmanager_data:
